# PPO configuration from Sunu 2 (slide 21).
# The key under "behaviors" MUST match Behavior Parameters -> Behavior Name in Unity.
behaviors:
  RollerBall_U63:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic: {gamma: 0.99, strength: 1.0}
    max_steps: 200000
    time_horizon: 64
    summary_freq: 10000
